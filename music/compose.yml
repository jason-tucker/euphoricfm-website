# EFM Music Portal — compose project `efm-music` (plan §3, P2 amendment).
#
# Deploy (botvps, as botuser, from this directory):
#   set MUSIC_TAG=<git short sha> in ./.env, then
#   docker compose -p efm-music up -d
# Roll back: set the previous MUSIC_TAG and `up -d` again. Watchtower is OFF
# for every service here, so each deploy is deliberate.
#
# Networks:
#   music-int        internal (no egress): web, worker, db, migrate
#   efm-music-hooks  EXTERNAL, web only: tickets-web → /api/hooks/tickets and
#                    web → tickets-web guild:read; also web's egress to
#                    discord.com for OAuth. Created by the main session at
#                    P1-net/Deploy-1: docker network create --subnet 172.31.250.0/24 efm-music-hooks
#   efm-public-net   EXTERNAL (existing), worker only: → tickets-web:3000/api/v1/*
#   worker-egress    worker only, FIXED subnet 172.31.252.0/24 (bridge, not
#                    internal): egress to euphoric.fm (AzuraCast), Kuma,
#                    Discord alerts
#   fetch-egress     music-fetch ONLY (v0.4.0), FIXED subnet 172.31.251.0/24,
#                    bridge br-efm-fetch: egress to SoundCloud. No other
#                    service is on it, and music-fetch is on nothing else
#                    (no music-int, no database, no other container).
#   probe            network_mode none
#
# The host egress guard is NOT applied by this repo: on botvps the systemd
# unit efm-music-egress.service (revision 3.1) keeps three chains, each rule
# matched by ingress bridge AND source: EFM-MUSIC-EGRESS (DOCKER-USER) drops
# RFC1918 / 169.254.0.0/16 / 100.64.0.0/10 from 172.31.251.0/24
# (fetch-egress, br-efm-fetch), 172.31.252.0/24 (worker-egress) and music-web
# (172.31.250.10); EFM-MUSIC-TAILNET (mangle FORWARD) drops the same sources
# routed out tailscale+; EFM-MUSIC-INPUT (INPUT) drops NEW connections to
# the host from the fetch, worker-egress and music-int bridges and music-web.
# efm-music-egress-check.timer re-checks every 5 min and rebuilds on drift.
# Accepted residual: the worker reaches the host via efm-public-net's gateway.
# That is why the subnets, the bridge name and music-web's address are
# pinned here: change them only together with that unit (README.md).
#
# Secrets: one env_file per service, mode 600, owned by botuser; templates in
# ./env/*.env.example. The probe gets no env_file at all.
#
# Memory (2 GB botvps, plan changelog "P2 execution amendment"): hard
# mem_limit + Node heap caps; Postgres tuned small.

name: efm-music


x-hardening: &hardening
  restart: unless-stopped
  # tini as PID 1: reaps orphaned children (busybox `timeout` watchers in the
  # probe) and forwards signals.
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  labels:
    com.centurylinklabs.watchtower.enable: "false"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-shot: create the spool/staging tree and chown it to uid 1000.
  music-init:
    image: ghcr.io/jason-tucker/euphoricfm-website-music:worker-${MUSIC_TAG:?set MUSIC_TAG in .env}
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "/app/init-dirs.sh"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - ${MUSIC_DATA_DIR:-./data}:/data
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"

  music-db:
    <<: *hardening
    image: postgres:16-alpine
    env_file: ./env/db.env
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=48MB
      - -c
      - wal_buffers=1MB
      - -c
      - max_wal_size=256MB
      - -c
      - autovacuum_max_workers=1
    # The postgres entrypoint chowns PGDATA and drops to the postgres user.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:size=16m
      - /var/run/postgresql:size=1m
    shm_size: 32m
    mem_limit: 96m
    memswap_limit: 96m # no swap on top of the limit (2 GB botvps)
    volumes:
      - music-db-data:/var/lib/postgresql/data
    networks:
      - music-int
    # TCP, not the socket: on a fresh volume the entrypoint's temporary
    # initdb server listens on the socket only, and a socket check could pass
    # before the real server is up (music-migrate would then fail its first
    # connect; it also retries for up to 60 s, see migrate/main.ts).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: SQL migrations as the DB owner, least-privilege music_app role,
  # default settings, one-time reviewer role seed.
  music-migrate:
    <<: *hardening
    image: ghcr.io/jason-tucker/euphoricfm-website-music:worker-${MUSIC_TAG:?set MUSIC_TAG in .env}
    command: ["node", "/app/migrate.mjs"]
    env_file: ./env/migrate.env
    restart: "no"
    mem_limit: 128m
    memswap_limit: 128m # no swap on top of the limit (2 GB botvps)
    networks:
      - music-int
    depends_on:
      music-db:
        condition: service_healthy

  music-web:
    <<: *hardening
    image: ghcr.io/jason-tucker/euphoricfm-website-music:web-${MUSIC_TAG:?set MUSIC_TAG in .env}
    env_file: ./env/web.env
    environment:
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=160
    ports:
      - "127.0.0.1:6096:3000"
    tmpfs:
      - /tmp:size=16m
      - /app/.next/cache:size=16m,uid=1000,gid=1000
    mem_limit: 256m
    memswap_limit: 256m # no swap on top of the limit (2 GB botvps)
    # PINNED MOUNTS (plan §3): web writes only the tus dir, art-in and
    # in-web; the probe's art JPEGs are read-only here.
    volumes:
      - ${MUSIC_DATA_DIR:-./data}/staging/uploads:/staging/uploads:rw
      - ${MUSIC_DATA_DIR:-./data}/staging/art-in:/staging/art-in:rw
      - ${MUSIC_DATA_DIR:-./data}/staging/art:/staging/art:ro
      - ${MUSIC_DATA_DIR:-./data}/spool/probe/in-web:/spool/probe/in-web:rw
      - ${MUSIC_DATA_DIR:-./data}/spool/probe/out:/spool/probe/out:ro
    networks:
      music-int: {}
      # Pinned so botvps's efm-music-egress.service can confine exactly this
      # container (tickets-web shares the /24 at .2). Keep this address.
      efm-music-hooks:
        ipv4_address: 172.31.250.10
    depends_on:
      music-init:
        condition: service_completed_successfully
      music-migrate:
        condition: service_completed_successfully

  music-worker:
    <<: *hardening
    image: ghcr.io/jason-tucker/euphoricfm-website-music:worker-${MUSIC_TAG:?set MUSIC_TAG in .env}
    env_file: ./env/worker.env
    environment:
      NODE_OPTIONS: --max-old-space-size=96
    tmpfs:
      - /tmp:size=8m
    mem_limit: 160m
    memswap_limit: 160m # no swap on top of the limit (2 GB botvps)
    # PINNED MOUNTS: final and art are read-only; the worker submits
    # finalize/cover/fetch-probe requests via in-worker and reads results
    # from out (ro).
    volumes:
      - ${MUSIC_DATA_DIR:-./data}/staging/final:/staging/final:ro
      - ${MUSIC_DATA_DIR:-./data}/staging/art:/staging/art:ro
      - ${MUSIC_DATA_DIR:-./data}/spool/probe/in-worker:/spool/probe/in-worker:rw
      - ${MUSIC_DATA_DIR:-./data}/spool/fetch/in:/spool/fetch/in:rw
      - ${MUSIC_DATA_DIR:-./data}/spool/probe/out:/spool/probe/out:ro
      - ${MUSIC_DATA_DIR:-./data}/spool/fetch/out:/spool/fetch/out:ro
    networks:
      - music-int
      - efm-public-net
      - worker-egress
    depends_on:
      music-init:
        condition: service_completed_successfully
      music-migrate:
        condition: service_completed_successfully

  music-probe:
    <<: *hardening
    image: ghcr.io/jason-tucker/euphoricfm-website-music:probe-${MUSIC_TAG:?set MUSIC_TAG in .env}
    # No network, no env_file, minimal env.
    network_mode: none
    environment:
      HOME: /tmp
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    memswap_limit: 256m # no swap on top of the limit (2 GB botvps)
    pids_limit: 128
    # CPU weight under contention (cgroup v2 cpu.weight ~10 vs ~39 for a
    # default container): a WAV conversion, and the copy / hash / publish of
    # up to 250 MB around it, yield to the Discord bots on the 1-vCPU botvps.
    # `nice -n 19` on ffmpeg only orders processes INSIDE this container's
    # cgroup. No blkio / IO weight: it depends on the host's IO scheduler.
    cpu_shares: 256
    # PINNED MOUNTS: only the staging subtrees the probe works on (not
    # /staging/fetch, which is P5's), plus /spool/probe; the inbox a request
    # arrives in decides which request types it may carry.
    volumes:
      - ${MUSIC_DATA_DIR:-./data}/staging/uploads:/staging/uploads:rw
      - ${MUSIC_DATA_DIR:-./data}/staging/final:/staging/final:rw
      - ${MUSIC_DATA_DIR:-./data}/staging/work:/staging/work:rw
      - ${MUSIC_DATA_DIR:-./data}/staging/art:/staging/art:rw
      - ${MUSIC_DATA_DIR:-./data}/staging/art-in:/staging/art-in:ro
      # v0.4.0: music-fetch's downloads, READ-ONLY (probe_fetch converts them)
      - ${MUSIC_DATA_DIR:-./data}/staging/fetch:/staging/fetch:ro
      - ${MUSIC_DATA_DIR:-./data}/spool/probe:/spool/probe:rw
    depends_on:
      music-init:
        condition: service_completed_successfully

  # v0.4.0 (plan P5): SoundCloud via a pinned, hash-locked yt-dlp
  # (fetch/README.md). The only container with internet egress to arbitrary
  # hosts, so it holds NOTHING: no env_file, no environment (it refuses to
  # start, exit 78, on any unexpected variable name), no secrets, no
  # database, no inbound port. It sees only its spool and its staging dir;
  # it never decodes media (the network-less probe does). One job at a time.
  music-fetch:
    <<: *hardening
    image: ghcr.io/jason-tucker/euphoricfm-website-music:fetch-${MUSIC_TAG:?set MUSIC_TAG in .env}
    tmpfs:
      - /tmp:size=16m,uid=1000,gid=1000,mode=0700
    # Measured (v0.4.0, CHANGELOG): the service idles at ~15 MiB and holds
    # 22 MiB RSS through a job; the pinned yt-dlp's native HLS download of a
    # 10-min 160 kbps AAC (61 fMP4 fragments) peaks at 47 MiB RSS, and the
    # whole cgroup at 88 MiB under a 128 MiB limit (the rest is page cache,
    # reclaimed, no OOM). 160 MiB leaves ~2x the anonymous peak.
    mem_limit: 160m
    memswap_limit: 160m # no swap on top of the limit (2 GB botvps)
    pids_limit: 64
    # yt-dlp's HLS download is network-bound; keep it behind the bots too.
    cpu_shares: 256
    # PINNED MOUNTS (plan §3): its spool (in: the worker's requests and release
    # markers; claimed: its own; out: its results, read-only for the worker)
    # and its staging dir (read-only for the probe). Nothing else.
    volumes:
      - ${MUSIC_DATA_DIR:-./data}/spool/fetch:/spool/fetch:rw
      - ${MUSIC_DATA_DIR:-./data}/staging/fetch:/staging/fetch:rw
    networks:
      - fetch-egress
    depends_on:
      music-init:
        condition: service_completed_successfully

networks:
  music-int:
    internal: true
  # The subnet is what efm-music-egress.service on botvps matches (see top).
  worker-egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.252.0/24
  # v0.4.0: music-fetch's egress. efm-music-egress.service on botvps already
  # DROPs RFC1918 / 169.254.0.0/16 / 100.64.0.0/10 from this subnet
  # (DOCKER-USER); the fixed bridge name lets an INPUT rule
  # (`-i br-efm-fetch -j DROP`) keep it off the host's own ports (README).
  fetch-egress:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-efm-fetch
    ipam:
      config:
        - subnet: 172.31.251.0/24
  efm-public-net:
    external: true
  efm-music-hooks:
    external: true

volumes:
  music-db-data: {}
