# Keeps dependencies and GitHub Actions patched. Grouping minor/patch bumps
# keeps PR noise down; majors come through individually for manual review.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns: ['*']

  # music-fetch (music/fetch, v0.4.0): the hash-locked yt-dlp and the
  # digest-pinned python base image. Review on the monthly bump
  # (music/fetch/README.md "Version pins and the monthly bump").
  - package-ecosystem: pip
    directory: '/music/fetch'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: '/music/fetch'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
