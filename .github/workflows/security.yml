name: security

# Security gates that run on every push/PR to main and weekly. Kept separate
# from build-and-publish.yml so a scan failure never blocks the deploy image
# from building, and so this can run on a schedule for drift.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

# Least privilege at the top; individual jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Unit + integration tests for the requests service -------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run server test suite
        run: node --test server/*.test.mjs

  # ---- Dependency vulnerability gate ---------------------------------------
  # The info site (root package). NOT a required check while it is known red:
  # astro 6.4.6 (critical GHSA-26w7-cxv4-gfx2, AVIF RCE; unreachable here: no
  # astro:assets / Sharp image service in the site) plus sharp/svgo highs, all
  # fixed by the Astro 7 upgrade in PR #25 (held). Once #25 merges this goes
  # green; make it required again then. The portal has its own hard gate
  # below (audit-music), so a portal advisory is never hidden behind this.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: pnpm audit (fail on High/Critical)
        run: pnpm audit --audit-level=high

  # The EFM Music Portal (music/: its own package and lockfile, not part of
  # the root audit above). A HARD gate, on pushes, PRs and the weekly run, so
  # a new High/Critical advisory in the portal's production dependencies
  # fails here even between portal changes. (build-music also runs
  # `pnpm audit --prod` at every level before it builds the images.)
  audit-music:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: music
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: music/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: pnpm audit, production dependencies (fail on High/Critical)
        run: pnpm audit --prod --audit-level=high

  # ---- Static analysis (CodeQL) --------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          # python: music/fetch (music-fetch: the yt-dlp runner, the link
          # validator, the env guard). No build step for either language.
          languages: javascript-typescript, python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  # ---- Secret scanning (gitleaks) ------------------------------------------
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history available; on PRs gitleaks scans the PR commits
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Required by gitleaks-action (v2 and later, incl. the v3 pinned
          # above) to scan pull requests via the API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  # NOTE: actions/dependency-review-action needs the repo's Dependency Graph
  # feature enabled (Settings → Security → Dependency graph) and errors out
  # otherwise. Dependency-vuln risk is already gated by the `audit` job
  # (pnpm audit --audit-level=high) + Dependabot, so dependency-review is left
  # out until Dependency Graph is enabled — re-add it then for license/PR gating.

  # ---- Caddyfile validation (catches a broken proxy/CSP config pre-deploy) --
  caddy-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate \
            --config /etc/caddy/Caddyfile --adapter caddyfile
