name: build-and-publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      # --ignore-scripts: don't run dependency lifecycle scripts in CI (matches
      # the Dockerfile build) so a malicious postinstall can't execute here.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # A real gate since @types/node is a devDependency (site v0.22.2):
      # 0 errors at the time the flag was dropped.
      - name: Astro check (typecheck)
        run: pnpm exec astro check

      - name: Build
        run: pnpm build
        env:
          PUBLIC_GIT_SHA: ${{ github.sha }}
          PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}

      # dist/ checks (Web Player page built, no Discord on it, home links it)
      # + the player helper unit tests.
      - name: Site build checks
        run: pnpm test:site

      # The Caddyfile's behaviour against the built dist/ (each script runs its
      # own throwaway caddy:2.10-alpine container, plus a node stub upstream for
      # the tickets block): the tickets.euphoric.gg /api/internal|/api/v1 404
      # (a security control), the /music 302 and the /player/ routing.
      - name: Caddy behaviour
        run: |
          rc=0
          for t in caddy-tickets-internal-block caddy-music-redirect caddy-player; do
            echo "::group::$t"
            sh "test/$t.sh" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/euphoricfm-website
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_GIT_SHA=${{ github.sha }}
            PUBLIC_BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

  # Independent image for the tiny shared pending-requests Node service in
  # server/. No shared deps with the site build above, so the two jobs run
  # in parallel; separate GHA cache scope keeps the layers from colliding.
  build-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/euphoricfm-website-requests
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=requests
          cache-to: type=gha,mode=max,scope=requests

  # EFM Music Portal (music/, compose project efm-music). Own package and
  # lockfile, so it never touches the site build above. Gate: pnpm audit
  # --prod, typecheck, then the full Docker harness (music/test/run.sh:
  # music-fetch's own unit suite, vitest + mount + start-up-guard checks
  # against mocks; no real credentials, and nothing contacts SoundCloud:
  # music-fetch runs with network_mode none and a fake yt-dlp). On main, the exact images the harness tested are retagged
  # and pushed as ghcr.io/<owner>/euphoricfm-website-music:<target>-<sha7>
  # (+ <target>-latest). Watchtower is off for these; deploys set MUSIC_TAG.
  build-music:
    runs-on: ubuntu-latest
    # A healthy run is ~13 min before the layer + fixture caches, less after;
    # a wedged worker/probe must not hold a runner for the 6 h default.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: music
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: music/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod

      - name: Typecheck
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
          pnpm exec tsc --noEmit

      - name: UI tests (jsdom, no stack)
        run: pnpm test:ui

      # Layer cache for the harness images (web/worker/probe/test/fetch):
      # compose builds through this buildx builder with type=gha cache
      # (test/compose.ci-cache.yml), like the build job's scope=site.
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # Exposes ACTIONS_RUNTIME_TOKEN / ACTIONS_*CACHE*/RESULTS_URL to the run
      # steps after it (a `run:` step does not get them otherwise), for the
      # gha cache the harness's compose build reads and writes. Only the
      # harness and the push steps follow; the token is job-scoped.
      - name: Expose the Actions runtime to the harness build
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The ~40 ffmpeg fixtures (test/setup/global.ts), keyed on the code that
      # makes them; the in-container key also covers the ffmpeg build, so a
      # stale restore is rebuilt, never used.
      - name: Restore the audio fixture cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: music/test/.out/fixture-cache
          key: music-fixtures-${{ hashFiles('music/test/setup/global.ts', 'music/test/helpers/id3.ts', 'music/test/helpers/soundcloud.ts', 'music/Dockerfile') }}

      - name: Test harness (Docker, mocks only)
        env:
          MUSIC_TEST_BUILD_CACHE: gha
          COMPOSE_BAKE: 'true'
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: sh test/run.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/euphoricfm-website-music
        run: |
          sha7="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          # fetch (v0.4.0): music-fetch, built from music/fetch by the harness
          for t in web worker probe fetch; do
            docker tag "ghcr.io/jason-tucker/euphoricfm-website-music:$t-local-test" "$REPO:$t-$sha7"
            docker tag "ghcr.io/jason-tucker/euphoricfm-website-music:$t-local-test" "$REPO:$t-latest"
            docker push "$REPO:$t-$sha7"
            docker push "$REPO:$t-latest"
          done
