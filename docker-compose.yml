# euphoricfm-website — Docker Compose stack.
#
# As of 0.4.0 this is the PUBLIC ingress for info.euphoric.fm. Caddy binds
# 0.0.0.0:80 + 0.0.0.0:443 directly on the host (not via cloudflared) so the
# in-game phone iframe can reach us without Cloudflare's bot-detection layer
# silently rejecting CEF clients. Let's Encrypt handles certs automatically.
#
# Watchtower polls GHCR every 60s and auto-pulls a new ${IMAGE}:latest when
# CI pushes one — push to main → live in ~60-90s.

services:
  # Service renamed `web` → `efm-web` so this stack and `euphoric-tickets-web`
  # don't both auto-claim the unqualified `web` alias on shared efm-public-net.
  # Latent footgun otherwise — any future container on this net resolving plain
  # `web` would round-robin between two backends. Same failure shape as the
  # `db` collision on botpanel-net that bit otterbot's `/oc` in v0.10.3.
  efm-web:
    image: ${IMAGE:-ghcr.io/jason-tucker/euphoricfm-website:latest}
    build:
      context: .
      args:
        PUBLIC_GIT_SHA: ${GIT_SHA:-dev}
        PUBLIC_BUILD_TIME: ${BUILD_TIME:-unknown}
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://info.euphoric.fm}
    restart: unless-stopped
    environment:
      # Hostname Caddy serves (and provisions a Let's Encrypt cert for).
      SITE_HOSTNAME: ${SITE_HOSTNAME:-info.euphoric.fm}
      # Tickets hostnames — both the cloudflared-fronted .fm and the
      # direct-DNS .gg get served by the same reverse-proxy block in
      # Caddyfile. Either can be overridden via .env on the VPS.
      TICKETS_HOSTNAME: ${TICKETS_HOSTNAME:-tickets.euphoric.fm}
      TICKETS_GG_HOSTNAME: ${TICKETS_GG_HOSTNAME:-tickets.euphoric.gg}
      # No webhook here: since v0.22.3 the contact forms post to the
      # efm-requests relay (/contact/*), which alone holds the Discord URL.
    # PUBLIC binding: Caddy needs :80 (ACME HTTP-01 challenge + http→https
    # redirect) and :443 (TLS). HTTP/3 over UDP/443 is opt-in; we leave it
    # off because some CEF clients hang trying to negotiate QUIC.
    ports:
      - "80:80"
      - "443:443"
    # ---- Hardening ---------------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Required so the non-root caddy user inside the container can bind
      # to ports below 1024 (80, 443).
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=32m
    # Persist Let's Encrypt certs + ACME state across restarts/redeploys so
    # we don't burn LE rate limits on every container restart.
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      # Default network for healthchecks; efm-public-net is the shared bridge
      # the Caddy uses to reverse_proxy to euphoric-tickets-web (tickets-web:3000).
      default: {}
      efm-public-net: {}
    healthcheck:
      # Hit Caddy's own loopback on 80 with curl (no -L), so the 308 → HTTPS
      # redirect counts as success without curl trying to follow it into a
      # TLS handshake on 127.0.0.1 (no cert there → SSL alert 80 → wget
      # exit 1, container marked unhealthy even though Caddy is fine).
      # `-f` doesn't trigger on 3xx, only 4xx/5xx, so 308 returns exit 0.
      # busybox wget here doesn't support --max-redirect; curl is the fix.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "3", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # efm-requests — tiny shared pending-requests store (see server/index.mjs),
  # also the station stats API (/stats/*) and the contact-form relay
  # (/contact/*). Caddy reverse-proxies /requests/* on info.euphoric.fm to this container so
  # every visitor sees every pending request (vs. the per-browser localStorage
  # state from v0.6.0). Reachable from efm-web on the default compose network
  # at `efm-requests:3000`. No host port binding — internal only.
  efm-requests:
    image: ${REQUESTS_IMAGE:-ghcr.io/jason-tucker/euphoricfm-website-requests:latest}
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: "3000"
      STORE_PATH: /data/pending.json
      # Override at runtime to point at a different AzuraCast instance for
      # the pruning poll. Default matches the public station shortcode.
      NOWPLAYING_URL: ${NOWPLAYING_URL:-https://euphoric.fm/api/nowplaying/euphoricfm}
      # ---- Station stats (server/stats.mjs) --------------------------------
      # AzuraCast's history API is auth-only (403 without a key), so full-time
      # backfill needs an admin API key with the station's reports/history
      # permission. Without it, stats still accumulate live from the 30s
      # nowplaying poll — graceful degradation, not a hard requirement.
      AZURACAST_API_KEY: ${AZURACAST_API_KEY:-}
      AZURACAST_API_BASE: ${AZURACAST_API_BASE:-https://euphoric.fm/api}
      STATION_ID: ${STATION_ID:-euphoricfm}
      STATS_STORE_PATH: /data/stats.json
      STATS_TZ: ${STATS_TZ:-America/New_York}
      STATS_BACKFILL_START: ${STATS_BACKFILL_START:-2023-01-01}
      # The API key never reaches clients — /stats/* only ever serves
      # aggregates. Set this to any new value + `docker compose up -d` to
      # recover from a bad backfill without volume surgery (read_only fs):
      # wipes play-derived stats.json fields but keeps listener sample data.
      STATS_BACKFILL_RESET: ${STATS_BACKFILL_RESET:-}
      # Ad/ID playlists excluded from listens (comma-separated, case-
      # insensitive exact names). Empty = the built-in default list in
      # server/stats.mjs (2Ads, 3EFM/Free Ads, 5Local Ads, Go Vote, 4EuphoricFM).
      STATS_EXCLUDE_PLAYLISTS: ${STATS_EXCLUDE_PLAYLISTS:-}
      # ---- Contact relay (server/index.mjs, /contact/*) ----------------------
      # Discord webhook the "Contact us" and /events inquiry forms are relayed
      # to. A credential (anyone holding it can post as, rename or delete the
      # webhook): it lives only in .env on the host and in this container,
      # is never logged, and never reaches visitors. Empty = the forms answer
      # 503. Change it with `docker compose up -d efm-requests` (a plain
      # restart keeps the old value).
      DISCORD_CONTACT_WEBHOOK: ${DISCORD_CONTACT_WEBHOOK:-}
    volumes:
      - efm_requests_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--tries=1", "--timeout=2", "http://127.0.0.1:3000/requests/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    command:
      - --label-enable
      - --cleanup
      - --interval=60
      - --include-stopped
      - --revive-stopped
    environment:
      WATCHTOWER_NOTIFICATIONS_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  # Shared bridge so this Caddy can reverse_proxy to the euphoric-tickets-web
  # container (`tickets-web:3000`). Create once on the host:
  #   docker network create efm-public-net
  efm-public-net:
    external: true

volumes:
  caddy_data:
  caddy_config:
  # Persistence for the pending-requests JSON store. Surviving redeploys
  # means a Watchtower restart doesn't wipe everyone's in-flight requests.
  efm_requests_data:
